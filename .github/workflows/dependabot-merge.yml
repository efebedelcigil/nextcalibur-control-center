# A dependency bump merges itself once its build and tests pass - patch,
# minor or major. The owner's call (23 September 2026): a queue of pull
# requests waiting for a click is a queue of known fixes not shipped.
#
# One exception waits for a person: a major version of Velopack. It is the
# part of the application that updates the application; a release built
# on one that no longer updates would leave every installed copy unable to
# receive the fix. CI builds and tests, it does not run an update.
#
# Auto-merge does not skip anything: GitHub holds the pull request until
# the branch's required check ("build") has passed, and merges then. The
# Velopack CLI the release packages with follows the package version in the
# project file (release.yml), so a bump here moves both together.
#
# pull_request_target is the trigger that runs with the repository's own
# token while a pull request is open, and it is dangerous for one reason:
# checking out the proposed branch and running anything from it hands that
# token to whoever opened the pull request. This workflow never checks out
# anything and never runs a line of the diff - it reads Dependabot's
# metadata from GitHub and calls gh. Keep it that way.
name: Dependabot

on: pull_request_target

permissions:
  contents: write
  pull-requests: write

jobs:
  merge:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      # The only thing this reads from the pull request is Dependabot's own
      # metadata, from GitHub rather than from the branch: nothing in the
      # proposed diff is checked out or run here.
      - name: What is being updated
        id: what
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98   # v3.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Merge once the build passes
        if: ${{ !(contains(steps.what.outputs.dependency-names, 'Velopack') && steps.what.outputs.update-type == 'version-update:semver-major') }}
        run: gh pr merge --auto --squash "$PR"
        env:
          PR: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Say why a Velopack major is waiting
        if: ${{ contains(steps.what.outputs.dependency-names, 'Velopack') && steps.what.outputs.update-type == 'version-update:semver-major' }}
        run: |
          gh pr comment "$PR" --body "A new major version of Velopack - the part that updates the application - so it waits for a person: try an update from the current release to a build with it before merging (.github/workflows/dependabot-merge.yml)."
        env:
          PR: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
