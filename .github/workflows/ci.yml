name: CI

# Every push and pull request: build in Release, run the tests. The tests
# that touch the machine (registry, tasks) are written to skip or pass on a
# runner that has none of it.

on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '*.md', 'notes/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: .NET 8 SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore Nextcalibur.sln

      - name: Build
        run: dotnet build Nextcalibur.sln -c Release --no-restore --nologo -warnaserror

      - name: Test
        run: dotnet test Nextcalibur.sln -c Release --no-build --nologo --logger "trx;LogFileName=tests.trx"

      - name: Test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: '**/TestResults/*.trx'
          retention-days: 7
