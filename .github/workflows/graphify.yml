name: Graphify

# Rebuilds the Graphify code knowledge graph whenever changes are pushed to
# main, and publishes the graph data and interactive HTML to a dedicated
# 'graphify' branch.
#
# Two jobs on purpose. Graphify is a third-party package from PyPI; the job
# that installs and runs it gets a read-only token and nothing else, and the
# job that holds the write token runs no code but git. A package pulled from
# PyPI with contents: write in reach could push to main.

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'installer/**'
      - 'tools/**'
      - 'tests/**'
      - '*.sln'
      - '*.csproj'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: graphify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97   # v5
        with:
          python-version: '3.11'

      # Pinned: an unpinned install runs whatever was published last.
      - name: Install Graphify
        run: pip install graphifyy==0.9.66

      - name: Rebuild Code Graph
        run: graphify update .

      - name: Upload Graph Artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a   # v7
        with:
          name: graphify-out
          path: graphify-out/
          retention-days: 30

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out the graphify branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7
        with:
          fetch-depth: 0

      - name: Download Graph Artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c   # v8.0.1
        with:
          name: graphify-out
          path: ${{ runner.temp }}/graph

      - name: Deploy to graphify branch
        env:
          GRAPH: ${{ runner.temp }}/graph
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if git ls-remote --exit-code --heads origin graphify >/dev/null; then
            git fetch origin graphify
            git checkout -B graphify origin/graphify
          else
            git checkout --orphan graphify
            git rm -rf --quiet .
          fi

          rm -rf graphify-out
          mkdir -p graphify-out
          cp -r "$GRAPH"/. graphify-out/

          # Root artifacts for quick navigation and GitHub Pages compatibility
          if [ -f "graphify-out/graph.html" ]; then
            cp graphify-out/graph.html index.html
          fi
          if [ -f "graphify-out/GRAPH_REPORT.md" ]; then
            cp graphify-out/GRAPH_REPORT.md README.md
          fi

          git add -A
          if git diff --staged --quiet; then
            echo "No changes detected in code graph."
          else
            git commit -m "chore(graphify): update code graph for ${GITHUB_SHA::7}"
            git push origin graphify
          fi
