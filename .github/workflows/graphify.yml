name: Graphify

# Automatically updates the Graphify code knowledge graph whenever changes
# are pushed to main, and publishes the graph data and interactive HTML to
# a dedicated 'graphify' branch.

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'installer/**'
      - 'tools/**'
      - 'tests/**'
      - '*.sln'
      - '*.csproj'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: graphify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  graphify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38   # v5
        with:
          python-version: '3.11'

      - name: Install Graphify
        run: pip install --upgrade graphifyy

      - name: Rebuild Code Graph
        run: graphify update .

      - name: Upload Graph Artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a   # v7
        with:
          name: graphify-out
          path: graphify-out/
          retention-days: 30

      - name: Deploy to graphify branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Temporarily store generated graph artifacts
          TEMP_GRAPH=$(mktemp -d)
          cp -r graphify-out/* "$TEMP_GRAPH/"

          # Fetch remote graphify branch if it already exists
          git fetch origin graphify:graphify 2>/dev/null || true

          if git show-ref --quiet refs/heads/graphify; then
            git checkout graphify
          else
            git checkout --orphan graphify
            git rm -rf .
          fi

          # Reset root files for the branch
          rm -rf graphify-out
          mkdir -p graphify-out
          cp -r "$TEMP_GRAPH"/* graphify-out/

          # Root artifacts for quick navigation and GitHub Pages compatibility
          if [ -f "graphify-out/graph.html" ]; then
            cp graphify-out/graph.html index.html
          fi
          if [ -f "graphify-out/GRAPH_REPORT.md" ]; then
            cp graphify-out/GRAPH_REPORT.md README.md
          fi

          git add -A
          if git diff --staged --quiet; then
            echo "No changes detected in code graph."
          else
            git commit -m "chore(graphify): update code graph for ${GITHUB_SHA::7}"
            git push origin graphify
          fi
